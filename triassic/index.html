<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-*)` non-zero, and the HUD and the
      touch pads are positioned off those insets so they clear a notch and a home bar.
      `maximum-scale=1, user-scalable=no` is here because **double-tap is a move in this game**
      (it is the pounce, and the dash): a browser that answered it with its own zoom would take
      the move away. It is a real accessibility cost and it is paid on the game pages only —
      the trilogy page, the viewer and the stats page all stay pinchable, and inside the game the
      view has its own pinch-to-zoom on the camera.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07202a" />
    <title>Triassic Triumph</title>
    <link rel="icon" href="../assets/triassic/brand/favicon.ico" sizes="48x48" />
    <link rel="icon" href="../assets/triassic/brand/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="../assets/triassic/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="../assets/triassic/brand/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/triassic/brand/apple-touch-icon.png" sizes="180x180" />
    <link href="../fonts/fonts.css" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #100d08; }
      .boot-title img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      @media (min-aspect-ratio: 3/1) { .boot-title img { object-fit: contain; } }
    </style>
  </head>
  <body>
    <!--
      The title painting, drawn by the page itself so it is on screen before any script has
      arrived: the game's own title screen replaces it with the same picture, already in the
      cache, and fetches the engine only after that (\`titleShown\` in src/app/App.tsx).
    -->
    <div id="root"><picture class="boot-title"><source media="(orientation: portrait)" srcset="../assets/triassic/brand/title-mobile.webp" /><img src="../assets/triassic/brand/title-panorama.webp" alt="" /></picture></div>
    <script type="module" src="/src/triassic/main.tsx"></script>
  </body>
</html>

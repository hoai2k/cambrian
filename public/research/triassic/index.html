<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference viewer</title>
<style>
  :root {
    --ink: #06161c; --ink-2: #0b2029; --ink-3: #103039; --line: #1d4450;
    --foam: #eefaf6; --mute: #8fb0b4; --lagoon: #61f2d5; --ember: #ffb36b; --coral: #ff5b6e; --pick: #7ae582;
    --pad: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--foam);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--lagoon); }
  header { position: sticky; top: 0; z-index: 20; background: rgba(6,22,28,.94);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px var(--pad); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .02em; font-weight: 650; }
  h1 small { color: var(--mute); font-weight: 400; margin-left: 8px; font-size: 12px; }
  input[type=search] { flex: 1 1 180px; min-width: 140px; background: var(--ink-2); color: var(--foam);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font: inherit; }
  input[type=search]:focus { outline: 2px solid var(--lagoon); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  button.chip, .seg button { background: var(--ink-2); color: var(--mute); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  button.chip:hover, .seg button:hover { color: var(--foam); border-color: #2c6374; }
  button.chip[aria-pressed=true] { background: var(--lagoon); color: var(--ink); border-color: var(--lagoon); font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; border-left: 1px solid var(--line); }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed=true] { background: var(--ember); color: var(--ink); font-weight: 650; }
  .seg button:disabled { opacity: .38; cursor: not-allowed; }
  .hint { color: var(--mute); font-size: 12px; }
  kbd { background: var(--ink-3); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; font: 11px/1.6 ui-monospace, monospace; color: var(--foam); }

  main { padding: var(--pad); }
  section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--ember);
    margin: 26px 0 2px; }
  section > p.note { color: var(--mute); margin: 0 0 14px; max-width: 68ch; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(var(--card, 230px), 1fr)); }
  .card { background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    cursor: pointer; display: flex; flex-direction: column; text-align: left; color: inherit; font: inherit; padding: 0; }
  .card:hover { border-color: var(--lagoon); }
  .card:focus-visible { outline: 2px solid var(--lagoon); outline-offset: 2px; }
  .shot { position: relative; aspect-ratio: 4 / 3; background: #081c24; overflow: hidden; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute);
    font-size: 12px; text-align: center; padding: 10px; }
  .tag { position: absolute; top: 7px; left: 7px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    background: rgba(6,22,28,.82); border: 1px solid var(--line); color: var(--mute); padding: 2px 7px; border-radius: 999px; }
  .tag.canon { color: var(--ink); background: var(--lagoon); border-color: var(--lagoon); font-weight: 650; }
  .count { position: absolute; bottom: 7px; right: 7px; font-size: 11px; background: rgba(6,22,28,.82);
    border: 1px solid var(--line); color: var(--mute); padding: 1px 7px; border-radius: 999px; }
  .meta { padding: 9px 11px 11px; }
  .meta .n { font-weight: 620; font-style: italic; }
  .meta .r { color: var(--mute); font-size: 12px; margin-top: 2px; }
  .meta .l { color: var(--ember); font-size: 11.5px; margin-top: 3px; }

  dialog { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100%; height: 100%; }
  dialog::backdrop { background: rgba(3,11,15,.93); }
  .sheet { display: flex; flex-direction: column; height: 100vh; color: var(--foam); }
  .top { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--ink); }
  .top .n { font-style: italic; font-weight: 650; font-size: 16px; }
  .top .r { color: var(--mute); font-size: 12.5px; }
  .top .sp { flex: 1; }
  /* The stage is exactly the space left between the top bar and the strip, and never more: an
     auto-sized grid row takes its height from the image, so a tall pose used to push the strip off
     the bottom of the sheet. A fixed 1fr row plus a contained img can never overflow. */
  .stage { flex: 1 1 0; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 1fr;
    grid-auto-rows: minmax(0, 1fr); gap: 8px; padding: 10px 14px; background: #050f14; }
  .stage.split { grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); }
  .pane { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; }
  /* The picture is pinned to the pane's four edges rather than laid out by it, so its box is the
     space available and never the image's own height: a portrait pose used to size the row, push
     past the stage and land on the thumbnail strip. `contain` then letterboxes it inside that box.
     It takes no clicks either — the only thing to press in here is the pick button over it. */
  .pane img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .pane .lab { position: absolute; top: 4px; left: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    background: rgba(6,22,28,.85); border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; color: var(--mute); }
  .pane .lab.canon { background: var(--lagoon); color: var(--ink); border-color: var(--lagoon); font-weight: 650; }
  .pane .empty { color: var(--mute); text-align: center; max-width: 42ch; font-size: 13px; }
  .pane .empty code { color: var(--ember); }
  .strip { display: flex; gap: 7px; overflow-x: auto; padding: 9px 14px; border-top: 1px solid var(--line); background: var(--ink); }
  .strip button { flex: 0 0 auto; width: 84px; height: 62px; padding: 0; border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden; background: var(--ink-2); cursor: pointer; }
  .strip button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .strip button[aria-current=true] { border-color: var(--ember); outline: 1px solid var(--ember); }
  .strip button.c { border-color: var(--lagoon); }
  .strip button { position: relative; }
  .strip button.picked { outline: 2px solid var(--pick); border-color: var(--pick); }
  .strip button .tick { position: absolute; top: 2px; right: 2px; background: var(--pick); color: #06161c;
    font-size: 10px; font-weight: 800; line-height: 1; padding: 2px 3px; border-radius: 3px; pointer-events: none; }
  .strip button .kindtag { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(6,22,28,.8);
    color: var(--lagoon); font-size: 9px; letter-spacing: .04em; text-transform: uppercase; text-align: center; }

  /* the pick affordance, one per pane, so the choice is never ambiguous about which image it means */
  .pane .pick { position: absolute; top: 4px; right: 4px; z-index: 5; background: rgba(6,22,28,.88);
    color: var(--foam); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px;
    font: inherit; font-size: 12px; cursor: pointer; }
  .pane .pick:hover { border-color: var(--pick); color: var(--pick); }
  .pane .pick.on { background: var(--pick); color: #06161c; border-color: var(--pick); font-weight: 700; }
  /* the second answer, stacked under the first: redraw this one rather than crown it or replace it */
  .pane .pick.redo { top: 34px; }
  .pane .pick.redo:hover { border-color: var(--ember); color: var(--ember); }
  .pane .pick.redo.on { background: var(--ember); color: #1c1004; border-color: var(--ember); }
  .decide { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 14px;
    border-top: 1px solid var(--line); background: var(--ink-2); font-size: 12.5px; }
  .decide .verdict { font-weight: 650; }
  .decide .verdict.green { color: var(--pick); }
  .decide .verdict.replace { color: var(--ember); }
  .decide .verdict.none { color: var(--mute); font-weight: 400; }
  .decide input[type=text] { flex: 1 1 260px; min-width: 160px; background: var(--ink); color: var(--foam);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12.5px; }
  .decide input[type=text]:focus { outline: 2px solid var(--lagoon); outline-offset: -1px; }
  .nav { display: inline-flex; gap: 4px; align-items: center; }
  .nav .pos { color: var(--mute); font-size: 12px; min-width: 52px; text-align: center; }
  button.chip.go { background: var(--pick); color: #06161c; border-color: var(--pick); font-weight: 700; }
  button.chip:disabled { opacity: .4; cursor: not-allowed; }
  .card.chosen { border-color: var(--pick); }
  .tag.pick { background: var(--pick); color: #06161c; border-color: var(--pick); font-weight: 700; left: auto; right: 7px; }
  .credit { padding: 7px 14px 11px; border-top: 1px solid var(--line); background: var(--ink);
    color: var(--mute); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .credit b { color: var(--foam); font-weight: 550; }
  @media (max-width: 700px) { .stage.split { grid-template-columns: 1fr; } .strip button { width: 66px; height: 50px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="page-title">Reference viewer <small id="tally"></small></h1>
    <input type="search" id="q" placeholder="Filter by name or role…" aria-label="Filter subjects">
    <div class="seg" role="group" aria-label="Which image to show">
      <button id="m-web" aria-pressed="true">Web reference</button>
      <button id="m-canon" aria-pressed="false">Canonical</button>
      <button id="m-split" aria-pressed="false">Both</button>
    </div>
    <button class="chip go" id="export">Export selections</button>
  </div>
  <div class="bar" style="margin-top:9px">
    <div class="chips" id="groups"></div>
    <button class="chip" id="only-todo" aria-pressed="false">Undecided only</button>
    <span style="flex:1"></span>
    <span class="hint"><kbd>C</kbd> toggle · <kbd>B</kbd> both · <kbd>←</kbd><kbd>→</kbd> image · <kbd>J</kbd><kbd>K</kbd> subject · <kbd>Enter</kbd> choose · <kbd>R</kbd> redraw · <kbd>X</kbd> clear · <kbd>Esc</kbd> close</span>
  </div>
</header>
<main id="main"></main>

<dialog id="dlg"><div class="sheet">
  <div class="top">
    <span class="n" id="d-name"></span><span class="r" id="d-role"></span>
    <span class="sp"></span>
    <div class="nav">
      <button class="chip" id="d-prev" title="Previous subject (K)">‹ Prev</button>
      <span class="pos" id="d-pos"></span>
      <button class="chip" id="d-next" title="Next subject (J)">Next ›</button>
    </div>
    <div class="seg" role="group" aria-label="Which image to show">
      <button id="d-web" aria-pressed="true">Web</button>
      <button id="d-canon" aria-pressed="false">Canonical</button>
      <button id="d-split" aria-pressed="false">Both</button>
    </div>
    <button class="chip" id="d-close">Close</button>
  </div>
  <div class="stage" id="d-stage"></div>
  <div class="decide">
    <span id="d-verdict"></span>
    <input type="text" id="d-note" placeholder="Note for the write-up — what the canonical image should change (optional)" aria-label="Note">
    <button class="chip" id="d-clear">Clear choice</button>
  </div>
  <div class="strip" id="d-strip"></div>
  <div class="credit" id="d-credit"></div>
</div></dialog>

<script src="data.js"></script>
<script>
// The page is the same review for any era; `data.js` says which one it was bundled for.
const ERA = window.REFERENCE_ERA;
const DATA = window.REFERENCE_DATA, CANON = window.REFERENCE_CANONICAL || {}, REPO = window.REFERENCE_DECIDED || {};
document.title = `${ERA.name} reference viewer`;
// getElementById rather than the `$` helper below: this runs at the top of the module, before it.
document.getElementById('page-title').firstChild.textContent = `${ERA.name} reference viewer `;
const $ = (id) => document.getElementById(id);
const all = DATA.groups.flatMap((g) => g.subjects.map((s) => ({ ...s, group: g.id, groupName: g.name, canon: CANON[s.id] || [] })));
const byId = new Map(all.map((s) => [s.id, s]));
const state = { mode: 'web', groups: new Set(DATA.groups.map((g) => g.id)), q: '', todoOnly: false, open: null, i: 0, ci: 0 };

/**
 * The choice, per subject: which single image is the one this animal should be built from. Keyed
 * by a *stable* reference rather than an index, so refetching the Commons set or regenerating the
 * deployed copy cannot silently move a decision onto a different picture.
 *
 * The state starts as the repository's own, bundled from the era's canonical manifest,
 * and a reload returns to it. Nothing is kept in this browser: clicks live in the tab until
 * *Export selections* takes them out, and applying that file is what makes them real. Decisions
 * used to persist in localStorage, which quietly made the page disagree with the codebase — a
 * reviewer looking at it a week later was reading their own old clicks, not what was applied.
 */
let sel = JSON.parse(JSON.stringify(REPO));
/** Does this subject still say what the repository says? Used only to report what is unsaved. */
const sameAsRepo = (id) => {
  const a = sel[id], b = REPO[id];
  if (!a || !b) return !a === !b;
  return a.verdict === b.verdict && a.ref === b.ref && (a.note || '') === (b.note || '');
};
const pending = () => all.filter((s) => !sameAsRepo(s.id)).length;

/**
 * Every candidate image for a subject in one list: the generated canonical pose and any extra
 * authored view first, then the web references, and the four-view modelling sheet last of all.
 * The sheet is what was made *from* a pose rather than another pose beside it, so it belongs at
 * the end of the row where it reads as the output of the decision and not as a rival to it.
 *
 * `ref` is the stable identity a choice is stored against — an authored image's label, a
 * reference's Commons filename — because both survive a rebuild and neither collides with the
 * other. `side` and `k` say where a shot sits in `s.canon` / `s.images`, because the two panes
 * step through those arrays and the display order is no longer the same as either.
 */
function shots(s) {
  const canon = s.canon.map((c, k) => ({
    kind: c.kind || 'canonical', ref: c.label, label: c.label,
    src: c.src, thumb: c.thumb || c.src, side: 'canon', k,
  }));
  const web = s.images.map((im, k) => ({
    kind: 'web', ref: im.title, label: im.title, src: im.thumb, thumb: im.thumb, side: 'web', k,
    title: im.title, artist: im.artist, licence: im.licence, page: im.page, full: im.full, description: im.description,
  }));
  const isModel = (c) => c.kind === 'turnaround' || c.kind === 'model-reference';
  return [...canon.filter((c) => !isModel(c)), ...web, ...canon.filter(isModel)];
}
const chosenRef = (id) => sel[id]?.ref;
const isChosen = (id, shot) => sel[id]?.ref === shot.ref;
/**
 * The verdict is about *whose* picture won, and nothing else. One of ours greenlights the subject
 * — and says which of ours is the canon, where a subject has more than one (the male and female
 * Keichousaurus, a modelling sheet beside its pose). A reference says ours is not right yet and
 * names the picture to regenerate toward.
 *
 * This was briefly cleverer: it also ranked our own images and called anything but the first of
 * them a rework. That made the summary disagree with the rows it was counting — a subject with a
 * male and a female pose read as a rework for picking the male — and it was the wrong question
 * anyway. Picking between our own variants is choosing the canon, not rejecting it.
 */
const verdictOf = (id) => sel[id]?.verdict ?? null;
const counts = () => {
  let green = 0, replace = 0, built = 0;
  for (const s of all) {
    const v = verdictOf(s.id);
    if (v === 'delivered') built++; else if (v === 'greenlit') green++; else if (v === 'replace') replace++;
  }
  return { green, replace, built, total: green + replace + built };
};

/**
 * Picking an image is the verdict: one of ours greenlights the subject and says which of ours is
 * the canon; a reference says ours is not right yet and names the picture to regenerate toward.
 */
function choose(id, shot) { set(id, shot, shot.kind === 'web' ? 'replace' : 'greenlit'); }
/**
 * The third answer, and the one this page could not say out loud until a reviewer had to say it
 * in prose: *redraw this one*. The reading is right and no other picture beats it, but the image
 * itself has something wrong — a fin, a scale that reads small, a pose out of its element. The
 * steer is then our own image and the note is the brief, so the regeneration has something to aim
 * at without borrowing somebody else's animal.
 */
function redraw(id, shot) { set(id, shot, 'replace'); }
function set(id, shot, verdict) {
  if (shot.kind === 'model-reference') return;
  sel[id] = { verdict, choice: shot.kind, ref: shot.ref, note: sel[id]?.note || '', at: new Date().toISOString() };
  refreshCounts(); render(); if (state.open) paint();
}
function clearChoice(id) { delete sel[id]; refreshCounts(); render(); if (state.open) paint(); }

function refreshCounts() {
  const c = counts(), p = pending();
  $('export').textContent = p ? `Export selections (${p} changed)` : 'Export selections';
  $('export').disabled = c.total === 0;
  $('export').title = p
    ? `${p} subject${p === 1 ? '' : 's'} differ from the codebase. Export and apply to make it real — nothing is kept in this browser.`
    : 'This page matches the codebase. Exporting now re-states the decisions already applied.';
  $('tally').textContent = `${all.length} subjects · ${all.reduce((n, s) => n + s.images.length, 0)} web images · `
    + `${all.filter((s) => s.canon.some((x) => (x.kind || 'canonical') === 'canonical')).length} with a canonical image · `
    + `${c.built ? `${c.built} delivered, ` : ''}${c.green} greenlit, ${c.replace} to redo`
    + (p ? ` · ${p} unsaved here` : ' · matching the codebase')
    + ` · Commons, ${DATA.generated}`;
}

// ---------- header controls
$('groups').innerHTML = DATA.groups.map((g) =>
  `<button class="chip" data-g="${g.id}" aria-pressed="true">${g.name} <span style="opacity:.65">${g.subjects.length}</span></button>`).join('');
$('groups').addEventListener('click', (e) => {
  const b = e.target.closest('[data-g]'); if (!b) return;
  const on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', String(on));
  on ? state.groups.add(b.dataset.g) : state.groups.delete(b.dataset.g);
  render();
});
$('only-todo').addEventListener('click', (e) => {
  state.todoOnly = !state.todoOnly;
  e.currentTarget.setAttribute('aria-pressed', String(state.todoOnly));
  render();
});
$('q').addEventListener('input', (e) => { state.q = e.target.value.toLowerCase(); render(); });
for (const [id, mode] of [['m-web', 'web'], ['m-canon', 'canon'], ['m-split', 'split'],
                          ['d-web', 'web'], ['d-canon', 'canon'], ['d-split', 'split']])
  $(id).addEventListener('click', () => setMode(mode));

function setMode(mode) {
  state.mode = mode;
  for (const [id, m] of [['m-web', 'web'], ['m-canon', 'canon'], ['m-split', 'split'],
                         ['d-web', 'web'], ['d-canon', 'canon'], ['d-split', 'split']])
    $(id).setAttribute('aria-pressed', String(m === mode));
  render(); if (state.open) paint();
}

// ---------- the export: what leaves the browser for the codebase
$('export').addEventListener('click', () => {
  const rows = [];
  for (const s of all) {
    const pick = sel[s.id]; if (!pick) continue;
    const shot = shots(s).find((x) => x.ref === pick.ref);
    rows.push({
      id: s.id, name: s.name, group: s.group, role: s.role,
      verdict: verdictOf(s.id),
      chose: pick.choice, ref: pick.ref, note: (pick.note || '').trim() || undefined, at: pick.at,
      image: shot ? (shot.kind === 'web'
        ? { kind: 'web', title: shot.title, artist: shot.artist, licence: shot.licence, page: shot.page, full: shot.full, description: shot.description || undefined }
        : { kind: shot.kind, label: shot.label, src: shot.src })
        : { kind: pick.choice, missing: true },
    });
  }
  const c = counts();
  const out = {
    schema: 'canonical-selections/1',
    era: ERA.id,
    generated: new Date().toISOString(),
    dataGenerated: DATA.generated,
    summary: { subjects: all.length, decided: c.total, greenlit: c.green, replace: c.replace, changedHere: pending() },
    howToApply: `${ERA.applyCmd} — greenlights the approved poses in ${ERA.canon}/manifest.json and writes the rework brief to ${ERA.canon}/review.md`,
    selections: rows,
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${ERA.id}-canonical-selections-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

// ---------- grid
function visible(s) {
  if (!state.groups.has(s.group)) return false;
  if (state.todoOnly && sel[s.id]) return false;
  if (!state.q) return true;
  return `${s.name} ${s.role} ${s.id} ${s.len}`.toLowerCase().includes(state.q);
}
function lead(s) {
  const canon = s.canon[0], web = s.images[0];
  if (state.mode === 'canon') return canon ? { src: canon.thumb || canon.src, canon: true } : null;
  if (state.mode === 'split' && canon) return { src: canon.thumb || canon.src, canon: true };
  return web ? { src: web.thumb, canon: false } : null;
}
function render() {
  $('main').innerHTML = DATA.groups.filter((g) => state.groups.has(g.id)).map((g) => {
    const subs = g.subjects.map((s) => byId.get(s.id)).filter(visible);
    if (!subs.length) return '';
    return `<section><h2>${g.name}</h2><p class="note">${g.note}</p><div class="grid">${subs.map(card).join('')}</div></section>`;
  }).join('') || `<p class="hint" style="padding:30px 0">Nothing matches that filter.</p>`;
}
function card(s) {
  const l = lead(s), v = verdictOf(s.id);
  const shot = l
    ? `<img src="${l.src}" alt="${s.name}" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="none">${state.mode === 'canon' ? 'no canonical image' : 'no reference found'}</div>`;
  return `<button class="card${v ? ' chosen' : ''}" data-id="${s.id}">
    <div class="shot">${shot}
      <span class="tag ${l && l.canon ? 'canon' : ''}">${l && l.canon ? 'canonical' : 'web'}</span>
      ${v ? `<span class="tag pick">${v === 'delivered' ? '★ delivered' : v === 'greenlit' ? '✓ greenlit' : '✎ redo'}</span>` : ''}
      <span class="count">${s.imagesAre ? '⚠ ' : ''}${s.images.length} web${s.canon.length ? ` · ${s.canon.length} canon` : ''}</span>
    </div>
    <div class="meta"><div class="n">${s.name}</div><div class="r">${s.role}</div><div class="l">${s.len}</div></div>
  </button>`;
}
$('main').addEventListener('click', (e) => {
  const b = e.target.closest('[data-id]'); if (b) open(b.dataset.id, 0);
});

// ---------- detail
const listNow = () => all.filter(visible);
function open(id, i) {
  const s = byId.get(id); if (!s) return;
  state.open = s; state.i = i; state.ci = 0;
  paint(); if (!$('dlg').open) $('dlg').showModal();
}
function step(d) {
  // Stepping never drops out of the set being worked through, even when "Undecided only" is on and
  // the subject just decided has left it: the position is taken before the filter is re-applied.
  const list = listNow();
  const s = state.open; if (!s) return;
  let at = list.findIndex((x) => x.id === s.id);
  if (at < 0) { const near = all.filter(visible); if (!near.length) return; at = d > 0 ? -1 : near.length; }
  const next = list[at + d];
  if (next) open(next.id, 0);
}
$('d-prev').addEventListener('click', () => step(-1));
$('d-next').addEventListener('click', () => step(1));
$('d-close').addEventListener('click', () => $('dlg').close());
$('dlg').addEventListener('close', () => { state.open = null; });
$('d-clear').addEventListener('click', () => { if (state.open) clearChoice(state.open.id); });
$('d-note').addEventListener('input', (e) => {
  const s = state.open; if (!s) return;
  if (!sel[s.id]) return;                                   // a note without a choice has nothing to attach to
  sel[s.id].note = e.target.value; refreshCounts();
});

/** The image the keyboard acts on: whichever side is on show. */
function currentShot() {
  const s = state.open; if (!s) return null;
  if (state.mode === 'canon') return canonShot(s, state.ci);
  return s.images.length ? webShot(s, Math.min(state.i, s.images.length - 1)) : null;
}
const canonShot = (s, k) => shots(s).find((x) => x.side === 'canon' && x.k === k) || null;
const webShot = (s, k) => shots(s).find((x) => x.side === 'web' && x.k === k) || null;

function pane(side, s) {
  const chosen = chosenRef(s.id);
  if (side === 'canon') {
    const c = s.canon[state.ci];
    if (!c) return `<div class="pane"><span class="lab canon">canonical</span><p class="empty">No canonical image yet. Drop one at
      <code>${ERA.canon}/${s.id}.png</code> and run <code>${ERA.viewerCmd}</code>.</p></div>`;
    const shot = canonShot(s, state.ci), on = chosen === shot.ref, v = verdictOf(s.id);
    const modelReference = c.kind === 'model-reference';
    return `<div class="pane"><span class="lab canon">${modelReference ? c.label : c.kind === 'turnaround' ? '3D model views' : c.kind === 'candidate' ? 'replacement candidate' : 'canonical'}${c.label !== 'canonical' && c.kind !== 'turnaround' && !modelReference ? ' · ' + c.label : ''}</span>
      ${modelReference ? '' : `<button class="pick${on && v === 'greenlit' ? ' on' : ''}" data-pick="${encodeURIComponent(shot.ref)}">${on && v === 'greenlit' ? '✓ Chosen' : 'Use as canon'}</button>
      <button class="pick redo${on && v === 'replace' ? ' on' : ''}" data-redraw="${encodeURIComponent(shot.ref)}" title="The reading is right but this image is not — say what to change in the note">${on && v === 'replace' ? '✎ Redrawing' : 'Needs redraw'}</button>`}
      <img src="${c.src}" alt="${s.name} canonical"></div>`;
  }
  const im = s.images[Math.min(state.i, Math.max(0, s.images.length - 1))];
  if (!im) return `<div class="pane"><span class="lab">web reference</span><p class="empty">No reference image was found for this subject on Commons.</p></div>`;
  const shot = webShot(s, Math.min(state.i, s.images.length - 1)), on = chosen === shot.ref;
  return `<div class="pane"><span class="lab">web reference</span>
    <button class="pick${on ? ' on' : ''}" data-pick="${encodeURIComponent(shot.ref)}" title="Ours is not right yet — regenerate it toward this picture">${on ? '✓ Chosen' : 'Redraw toward this'}</button>
    <img src="${im.thumb}" alt="${im.title}"></div>`;
}

function paint() {
  const s = state.open; if (!s) return;
  $('d-name').textContent = s.name;
  $('d-role').textContent = `${s.role} · ${s.len}`;
  $('d-role').title = s.imagesAre || '';
  const list = listNow(), at = list.findIndex((x) => x.id === s.id);
  $('d-pos').textContent = at >= 0 ? `${at + 1} / ${list.length}` : `– / ${list.length}`;
  $('d-prev').disabled = at <= 0;
  $('d-next').disabled = at < 0 || at >= list.length - 1;
  $('d-canon').disabled = $('d-split').disabled = !s.canon.length;

  const stage = $('d-stage');
  stage.classList.toggle('split', state.mode === 'split');
  stage.innerHTML = state.mode === 'split' ? pane('web', s) + pane('canon', s)
    : (state.mode === 'canon' ? pane('canon', s) : pane('web', s));

  // the decision
  const pick = sel[s.id], v = verdictOf(s.id);
  const shot = pick ? shots(s).find((x) => x.ref === pick.ref) : null;
  $('d-verdict').className = `verdict ${v === 'delivered' || v === 'greenlit' ? 'green' : v === 'replace' ? 'replace' : 'none'}`;
  $('d-verdict').textContent = !pick ? 'No choice yet — pick the image this animal should be built from.'
    : v === 'delivered' ? '★ Delivered — the model is built. The body is what is under review now, in the specimen viewer.'
    : v === 'greenlit' ? '✓ Greenlit — our own image is the one; build from it.'
    : pick.choice === 'web' ? `✎ Redo the canonical image toward: ${shot ? shot.label : pick.ref}`
    : `✎ Redraw our own ${shot && shot.kind === 'turnaround' ? 'modelling sheet' : 'pose'} — the note is the brief.`;
  $('d-note').value = pick?.note || '';
  $('d-note').disabled = !pick;
  $('d-clear').disabled = !pick;

  const allShots = shots(s);
  $('d-strip').innerHTML = allShots.map((shot, k) => {
    const canonSide = shot.side === 'canon';
    const cur = canonSide ? (state.mode === 'canon' && shot.k === state.ci) : (state.mode !== 'canon' && shot.k === state.i);
    return `<button class="${canonSide ? 'c ' : ''}${isChosen(s.id, shot) ? 'picked' : ''}" data-shot="${k}" aria-current="${cur}" title="${shot.label}">
      <img src="${shot.thumb}" alt="" loading="lazy">
      ${isChosen(s.id, shot) ? '<span class="tick">✓</span>' : ''}
      ${shot.kind === 'turnaround' ? '<span class="kindtag">3D views</span>' : ''}
      ${shot.kind === 'candidate' ? `<span class="kindtag">${shot.label}</span>` : ''}
      ${shot.kind === 'model-reference' ? '<span class="kindtag">model reference</span>' : ''}
    </button>`;
  }).join('');

  const web = s.images[Math.min(state.i, Math.max(0, s.images.length - 1))];
  $('d-credit').innerHTML = state.mode === 'canon'
    ? (s.canon[state.ci]?.kind === 'model-reference'
      ? '<span><b>Modelling reference only</b> — derived from the greenlit pose. The canonical pose remains the authority; this reference cannot replace it.</span>'
      : `<span><b>${s.canon[state.ci]?.kind === 'turnaround' ? 'Modelling sheet' : s.canon[state.ci]?.kind === 'candidate' ? 'Replacement candidate — choose to greenlight' : 'Canonical image'}</b> — our own art for this subject. Press <kbd>C</kbd> to flip back to the reference, <kbd>Enter</kbd> to choose it.</span>`)
    : (web ? (s.imagesAre ? `<span style="flex:1 1 100%;color:var(--coral)">⚠ ${s.imagesAre}</span>` : '')
        + `<span><b>${web.title}</b></span><span>${web.artist}</span><span>${web.licence}</span>`
        + `<a href="${web.page}" target="_blank" rel="noreferrer">file page</a>`
        + `<a href="${web.full}" target="_blank" rel="noreferrer">full size</a>`
        + (web.description ? `<span style="flex:1 1 100%">${web.description}</span>` : '')
      : '<span>Nothing found. Try a different search term in subjects.json and re-run fetch-images.mjs.</span>');
}

$('d-stage').addEventListener('click', (e) => {
  const b = e.target.closest('[data-pick],[data-redraw]'); if (!b || !state.open) return;
  const id = state.open.id, redo = b.dataset.redraw !== undefined;
  const ref = decodeURIComponent(redo ? b.dataset.redraw : b.dataset.pick);
  // Pressing the answer a subject already gives takes it back; pressing the other one switches.
  if (chosenRef(id) === ref && (verdictOf(id) === 'replace') === redo) { clearChoice(id); return; }
  const shot = shots(state.open).find((x) => x.ref === ref); if (!shot) return;
  redo ? redraw(id, shot) : choose(id, shot);
});
$('d-strip').addEventListener('click', (e) => {
  const b = e.target.closest('[data-shot]'); if (!b || !state.open) return;
  const s = state.open, shot = shots(s)[+b.dataset.shot]; if (!shot) return;
  if (shot.side === 'canon') { state.ci = shot.k; if (state.mode === 'web') setMode('canon'); else paint(); }
  else { state.i = shot.k; if (state.mode === 'canon') setMode('web'); else paint(); }
});

// ---------- keyboard
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape' || e.key === 'Enter') e.target.blur(); return; }
  if (e.key === '/') { e.preventDefault(); $('q').focus(); return; }
  const k = e.key.toLowerCase();
  if (k === 'c') {
    e.preventDefault();
    setMode(state.mode === 'canon' ? 'web' : state.mode === 'web' ? 'canon' : 'web');
    return;
  }
  if (k === 'b') { e.preventDefault(); setMode(state.mode === 'split' ? 'web' : 'split'); return; }
  if (!state.open) return;
  const s = state.open;
  if (e.key === 'Enter') {
    e.preventDefault();
    const shot = currentShot();
    if (shot) { chosenRef(s.id) === shot.ref ? clearChoice(s.id) : choose(s.id, shot); }
    return;
  }
  if (k === 'r') {
    e.preventDefault();
    const shot = currentShot();
    if (shot && shot.kind !== 'web') { chosenRef(s.id) === shot.ref && verdictOf(s.id) === 'replace' ? clearChoice(s.id) : redraw(s.id, shot); }
    return;
  }
  if (k === 'x') { e.preventDefault(); clearChoice(s.id); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    const d = e.key === 'ArrowRight' ? 1 : -1;
    if (state.mode === 'canon') { const n = Math.max(1, s.canon.length); state.ci = (state.ci + d + n) % n; }
    else { const n = Math.max(1, s.images.length); state.i = (state.i + d + n) % n; }
    paint();
  }
  if (k === 'j') step(1);
  if (k === 'k') step(-1);
});

refreshCounts();
render();
</script>
</body>
</html>

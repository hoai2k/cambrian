name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run devonian:check
      - run: npm run triassic
      - run: npm run eras
      - run: npm run sculpt
      # The rig tests: creature anchors and the attachment pass, read off the shipped GLBs.
      # They need no browser and no network, only the creature assets already in the repo,
      # and take about eight seconds together — cheap enough that a rig regression can no
      # longer sit unnoticed behind a doc that says to run them by hand.
      - run: npm run rigs
      # The cheap half of the sim suites, `npm run sim` being the whole sweep (22 minutes, which is
      # why only this half is here). It exists because `tools/flora-test.ts`'s step-cost guard had
      # been failing on main for a day without anything noticing: the gate never ran it, and until
      # now neither did any npm script, so the only way to run it was to type the tsx line by hand.
      # The guard is wall clock and this runner is not the machine anyone measured on, so the
      # threshold is a ceiling with about 45% of room under it rather than a mark to hit — see the
      # note in tools/flora-test.ts before tightening it.
      - run: npm run sim:gate
      # The site root and the debug entry points. Both are sub-second pure-TypeScript checks,
      # and between them they hold the trilogy page's links and the parameter that opens each
      # development tool — including that a bare ?debug never opens anything on a game page.
      - run: npm run ancientseas
      - run: npm run debug
      - run: npm run portraits
      # The feedback button exists only in a build that was given somewhere to send to. Unset —
      # a fork, or a repository variable that got lost — publishes the site without the button
      # rather than with one that fails; see docs/FEEDBACK.md. The URL is committed rather than
      # kept secret because it is compiled into the bundle either way, so anyone who opens the
      # site can read it; a FEEDBACK_ENDPOINT repository variable wins when one is set, which is
      # how the deployment changes without a commit.
      - run: npm run build
        env:
          VITE_FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT || 'https://script.google.com/macros/s/AKfycbyu8lINxYMmtqFhFarxqqIwHbGupWWoWjmeN_OW-kNSPW6Hgh6-KdkQuZAaWOcamTFF/exec' }}
          VITE_TURNSTILE_KEY: ${{ vars.TURNSTILE_KEY }}
          # Stamped onto every piece of feedback, so a report can be placed against the build it
          # came from rather than against whatever is live by the time it is read.
          VITE_BUILD: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run devonian:check
      # Every headless suite the deploy vouches for, in one parallel run (tools/test.mjs): the cheap
      # half of the simulation (`gate`; `npm run sim` is the whole sweep), the Triassic's body
      # audits and era checks, the era tables, the viewer's five editors and the Animations pane,
      # the rig tests, the site root and debug entry points, the portraits and every other suite
      # that takes seconds rather than minutes. Each used to be its own step here, run one after
      # another on one core, and two dozen suites ran nowhere at all. `node tools/test.mjs --list`
      # prints what `ci` is. The flora step-cost guard is wall clock, so the runner gives it the
      # machine to itself before the parallel batch starts — see the note in tools/flora-test.ts
      # before tightening its threshold.
      - run: npm run ci
      # The feedback button exists only in a build that was given somewhere to send to. Unset —
      # a fork, or a repository variable that got lost — publishes the site without the button
      # rather than with one that fails; see docs/FEEDBACK.md. The URL is committed rather than
      # kept secret because it is compiled into the bundle either way, so anyone who opens the
      # site can read it; a FEEDBACK_ENDPOINT repository variable wins when one is set, which is
      # how the deployment changes without a commit.
      - run: npm run build
        env:
          VITE_FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT || 'https://script.google.com/macros/s/AKfycbyu8lINxYMmtqFhFarxqqIwHbGupWWoWjmeN_OW-kNSPW6Hgh6-KdkQuZAaWOcamTFF/exec' }}
          VITE_TURNSTILE_KEY: ${{ vars.TURNSTILE_KEY }}
          # Stamped onto every piece of feedback, so a report can be placed against the build it
          # came from rather than against whatever is live by the time it is read.
          VITE_BUILD: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
